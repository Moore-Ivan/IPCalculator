plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.4.2'
}

def cfgAppName = 'IPCalculator' // 内部标识、文件名前缀、主 Jar 名
def cfgDisplayName = 'IP子网计算器' // 安装包显示的名称、开始菜单名称
def cfgVersion = '1.5.3' // 统一版本号
def cfgMainClass = 'com.ipcalculator.SubnetGUI' // 统一主类入口
def cfgVendor = 'Ivan' // 发行商/公司名称
def cfgMainJarName = "${cfgAppName}-${cfgVersion}.jar" // 动态计算主 Jar 名称

// 将版本号注入到 Gradle 项目全局属性中 (影响默认打包命名)
project.version = cfgVersion
project.group = 'com.ipcalculator' // 建议加上 group，Maven 发布时需要

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.5'
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 【优化】使用现代的 Toolchain 替代老旧的 sourceCompatibility
/*java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}*/

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ==========================================
// 将版本号注入到 classpath 资源 (version.properties)
// 这样运行时 VersionInfo 可读取与构建一致的版本号，作为更新检查的基准
// ==========================================
processResources {
    filesMatching('version.properties') {
        expand(version: project.version)
    }
}

// ==========================================
// 1. 配置 Application 插件 (核心入口)
// ==========================================
application {
    // 指定你的 Swing 界面主类
    mainClass = cfgMainClass
}

// ==========================================
// 2. 配置 标准 Jar (Thin Jar)
// ==========================================
jar {
    archiveBaseName.set(cfgAppName)
    archiveVersion.set(cfgVersion)
    archiveClassifier.set('') // 确保标准 Jar 没有后缀
    manifest {
        attributes(
            'Main-Class': application.mainClass.get(),
            'Implementation-Title': cfgDisplayName,
            'Implementation-Version': cfgVersion
        )
    }
}

// ==========================================
// 3. 配置 Fat Jar (Shadow Jar)
// ==========================================
shadowJar {
    archiveBaseName.set(cfgAppName)
    archiveVersion.set(cfgVersion)
    archiveClassifier.set('all') 
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    // 【防坑配置】智能合并 SPI 资源文件，防止第三方库(如 FlatLaf)内部配置被覆盖
    mergeServiceFiles()
    append 'META-INF/LICENSE'
    append 'META-INF/NOTICE'
}

// ==========================================
// 4. 预构建 JRE：jlink 全模块 + 完整 cacerts
//    解决 jpackage --add-modules 的两个系统性缺陷：
//    (a) 手动列举模块容易遗漏 (如 jdk.crypto.ec) 导致 TLS 握手失败
//    (b) jlink 默认不拷贝 JDK 完整 cacerts 根证书库，导致 PKIX 路径构建失败
// ==========================================
def preparedJreDir = layout.buildDirectory.dir("custom-jre").get().asFile
tasks.register('prepareJre', Exec) {
    def jlinkExec = "${System.getProperty('java.home')}/bin/jlink"
    if (org.gradle.internal.os.OperatingSystem.current().windows) {
        jlinkExec += ".exe"
    }
    doFirst {
        if (preparedJreDir.exists()) {
            preparedJreDir.deleteDir()
        }
    }
    commandLine jlinkExec,
            '--add-modules', 'ALL-MODULE-PATH',
            '--output', preparedJreDir.absolutePath,
            '--no-header-files',
            '--no-man-pages',
            '--compress', '2'
    doLast {
        def srcCacerts = file("${System.getProperty('java.home')}/lib/security/cacerts")
        if (srcCacerts.exists()) {
            def destDir = new File(preparedJreDir, "lib/security")
            destDir.mkdirs()
            ant.copy(file: srcCacerts, tofile: new File(destDir, "cacerts"))
            logger.lifecycle("已将完整 cacerts 拷贝到预构建 JRE")
        }
    }
}

// ==========================================
// 5. 配置原生 jpackage 打包
// ==========================================
tasks.register('myJpackage', Exec) {
    dependsOn 'installDist', 'prepareJre'

    def jpackageExec = "${System.getProperty('java.home')}/bin/jpackage"
    if (org.gradle.internal.os.OperatingSystem.current().windows) {
        jpackageExec += ".exe"
    }

    def argsList = [
        jpackageExec,
        '--name', cfgAppName,
        '--app-version', "${project.version}",
        '--vendor', cfgVendor,
        '--copyright', "Copyright @ ${cfgVendor}",
        '--description', "IPv4/IPv6 subnet calculator based on Java Swing",
        '--input', layout.buildDirectory.dir("install/IPCalculator/lib").get().asFile.absolutePath,
        '--main-jar', cfgMainJarName,
        '--main-class', cfgMainClass,
        '--dest', layout.buildDirectory.dir("jpackage").get().asFile.absolutePath,
        // 使用预构建 JRE (包含完整模块和 cacerts)
        '--runtime-image', preparedJreDir.absolutePath
    ]

    if (org.gradle.internal.os.OperatingSystem.current().windows) {
        argsList.addAll([
            '--type', 'exe',
            '--icon', "${projectDir}/src/main/resources/${cfgAppName}.ico",
            '--win-shortcut',
            '--win-shortcut-prompt',
            '--win-dir-chooser',
            '--win-menu'
        ])
    } else if (org.gradle.internal.os.OperatingSystem.current().macOsX) {
        argsList.addAll([
            '--type', 'dmg'
        ])
    }

    commandLine argsList
}